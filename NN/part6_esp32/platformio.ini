; Part 6: ESP32 7-segment decoder. Build and flash from this folder:
;   pio run -t upload && pio device monitor
; The network library lives in ../part4_5_c/lib/nn, the weights in ../models/7seg_net.h.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../part4_5_c/lib
build_flags = -I../models
; common-anode display instead of common cathode:
;   build_flags = -I../models -DCOMMON_ANODE
