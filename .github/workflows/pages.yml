# Builds the web page of every project, runs the tests and publishes everything to GitHub Pages:
#   https://<owner>.github.io/INSY/       web/ (start page: general design, rules and prompt log, list of projects)
#   https://<owner>.github.io/INSY/NN/    NN/web (neural network, Parts 1-6)
name: Build, test and deploy pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: mymindstorm/setup-emsdk@v14
      - name: Install Python packages
        run: pip install -r NN/requirements.txt -e NN
      - name: Build the NN web page (copies models + Python code, compiles C and the ESP32 sketch to WebAssembly)
        run: NN/web/build.sh
      - name: Build the general site (copies DESIGN.md and the general prompt log)
        run: web/build.sh
      - name: Tests (Python, C, ESP32 host build, WebAssembly in Node)
        run: cd NN && pytest -q
      - name: Tests of the repo tools (token usage)
        run: pytest -q tools
      - name: Assemble the site
        run: |
          mkdir -p _site/NN
          cp -r web/*.html web/assets web/build _site/
          cp -r NN/web/*.html NN/web/assets NN/web/build _site/NN/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
