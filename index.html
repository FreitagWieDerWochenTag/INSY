<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INSY Projects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root { color-scheme: light; --ground: #e9eeec; --surface: #f6f8f7; --ink: #17211d; --muted: #5b6863; --line: #c9d2ce; --act: #0f8a6c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --ground: #0f1412; --surface: #171e1b; --ink: #e3ebe7; --muted: #93a39c; --line: #2c3833; --act: #3cc9a0; } }
:root[data-theme="dark"] { color-scheme: dark; --ground: #0f1412; --surface: #171e1b; --ink: #e3ebe7; --muted: #93a39c; --line: #2c3833; --act: #3cc9a0; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; padding: 40px 16px; }
main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font: 700 2rem/1.1 "Chakra Petch", system-ui, sans-serif; margin: 0; }
p { margin: 0; color: var(--muted); }
a.card { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--muted); }
a.card strong { font: 700 1.15rem "Chakra Petch", system-ui, sans-serif; }
a.card span { color: var(--act); font-size: 0.8rem; font-weight: 500; }
</style>
</head>
<body>
<main>
  <h1>INSY Projects</h1>
  <p>School projects for INSY. Each one has its own folder in the repository.</p>
  <a class="card" href="NN/">
    <span>NN · Parts 1–6</span>
    <strong>Neural network: BCD → 7-segment decoder</strong>
    <p>A network written from scratch in Python, compared with TensorFlow, run in C, and on an ESP32. Interactive, running the real code.</p>
  </a>
</main>
</body>
</html>
